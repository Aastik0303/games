# Local full stack: frontend + API + Redis + PostgreSQL.
#   docker compose up --build
#   open http://localhost:3000
# Development credentials only. Production uses managed Redis/PostgreSQL and real secrets (see backend/docs/OPERATIONS.md).
name: prism

services:
  redis:
    image: redis:7.4.2-alpine
    # Live state is ephemeral by design; no persistence needed locally.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism-dev-only
      POSTGRES_DB: prism
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      PRISM_ENV: development
      PRISM_REDIS_URL: redis://redis:6379/0
      PRISM_DATABASE_URL: postgresql+asyncpg://prism:prism-dev-only@postgres:5432/prism
      PRISM_DB_AUTO_CREATE: "false"
      PRISM_CORS_ORIGINS: '["http://localhost:3000"]'
      PRISM_PUBLIC_WS_BASE_URL: ws://localhost:8000
      PRISM_COOKIE_SECURE: "false"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_MODE: http
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
